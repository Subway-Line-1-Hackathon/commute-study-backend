spring:
  application:
    name: commute-study-api
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
    # 운영에서는 끈다(#36 운영 점검). 로컬에서 SQL을 보고 싶으면 .env에 JPA_SHOW_SQL=true
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # Supabase의 6543(Transaction pooling)은 Flyway의 advisory lock(세션 단위)과
    # 호환되지 않으므로, 마이그레이션은 5432(Session/Direct) 접속으로 분리한다.
    url: ${spring.flyway.url}
    user: ${spring.flyway.user}
    password: ${spring.flyway.password}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256
          audiences: authenticated

  servlet:
    multipart:
      # Keep accepted multipart payloads in memory; never persist lecture files on server disk.
      file-size-threshold: 35MB
      # 업로드 한도(30MB)보다 크게 잡아, 초과 거부는 프레임워크가 아니라
      # 애플리케이션 코드가 FILE_TOO_LARGE로 먼저 하게 한다(명세서 10장).
      max-file-size: 35MB
      # PNG 20 x 30MiB plus multipart overhead. Each file is still checked against 30MiB.
      max-request-size: 605MB

server:
  port: ${PORT:8080}
  # Railway terminates TLS before forwarding HTTP to the app. Reconstruct the
  # public scheme/host before Spring Security CORS and springdoc generate URLs.
  forward-headers-strategy: framework

# 아래는 백엔드 개발 명세서 5장 설정값. 숫자를 코드에 하드코딩하지 않고 여기서 읽는다.
app:
  timezone: Asia/Seoul
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://127.0.0.1:5501,http://localhost:5500,http://localhost:5501}

commute:
  min-minutes: 10
  max-minutes: 120

user:
  nickname-min: 2
  nickname-max: 10

study:
  curriculum-min-minutes: 20
  summary-minutes: 3
  max-questions-per-session: 30
  minutes-per-question:
    ox: 0.5
    mc: 1
    short: 1.5

question:
  pregen-total: 40
  # 사전 생성 난이도·부족분 재요청 횟수는 기획·AI 담당과 확정 전 임시값 (#24 HITL)
  pregen-difficulty: 2
  pregen-refill-max: 2
  max-per-category-difficulty: 60
  # 실패 단원 재시도 스케줄러. 팀 공용 DB라 로컬 서버가 남의 단원을 건드리지 않게 기본은 끈다.
  # 로컬에서 시험할 때만 .env에 QUESTION_PREGEN_RETRY_ENABLED=true
  pregen-retry-enabled: ${QUESTION_PREGEN_RETRY_ENABLED:false}
  pregen-retry-check-interval: 5m
  pregen-retry-delay: 10m
  pregen-retry-max: 1
  pregen-ratio:
    ox: 14
    mc: 13
    short: 13

upload:
  max-file-mb: 30
  allowed-types: PDF,PPTX,PNG

material:
  # One gate covers scheduled and post-commit cleanup; never enable on shared-DB local development.
  cleanup-enabled: ${MATERIAL_CLEANUP_ENABLED:false}
  cleanup-cron: "0 0 3 * * *"
  recovery-check-interval: 1m
  retention-days: 7
  max-per-user: 10
  processing-timeout-minutes: 10

report:
  min-answers: 5

wrongnote:
  max-open: 100
  max-resolved: 50

ai:
  server-url: ${AI_SERVER_URL:http://localhost:8000}
  internal-key: ${AI_INTERNAL_KEY:}
  max-concurrency: 3
  signed-url-ttl-minutes: ${AI_SIGNED_URL_TTL_MINUTES:10}
  question-daily-limit: 20
  # 개발·데모용: 요청의 X-Mock-Error 헤더를 AI 서버(mock)로 넘긴다. 운영에서는 false
  mock-error-passthrough: ${AI_MOCK_ERROR_PASSTHROUGH:false}
  timeout:
    health: 5
    ai01: 300
    ai02: 60
    ai02-extra: 60
    ai03: 5
    ai05: 15
    ai06: 15

storage:
  url: ${SUPABASE_URL:}
  bucket: ${SUPABASE_STORAGE_BUCKET:}
  key: ${SUPABASE_STORAGE_KEY:}
  expected-host: ${SUPABASE_HOST:}
